<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
    <title>Imagen → LVGL RGB565</title>
</head>

<body>
<div class="Titulo">
<h1>Conversor de imágenes para LVGL</h1>
</div>
<div class="Seimagen">
<h2>1. Seleccionar imagen</h2>

<input
    type="file"
    id="fileInput"
    accept="image/*"
>
</div>


<div class="ajustes">
    <strong>Imagen original:</strong>
    <span id="infoOriginal">Ninguna imagen seleccionada</span>


<h2>2. Opciones</h2>

<label>
    Modo de ajuste:
</label>

<select id="modo">
    <option value="crop">Recortar para llenar</option>
    <option value="contain">Mantener proporción</option>
    <option value="stretch">Estirar a 128x160</option>
</select>


<label>
    Rotación:
</label>

<select id="rotacion">
    <option value="0">0°</option>
    <option value="90">90°</option>
    <option value="180">180°</option>
    <option value="270">270°</option>
</select>


<label>
    Posición horizontal:
</label>

<input
    type="range"
    id="posX"
    min="-100"
    max="100"
    value="0"
>

<span id="posXValue">0</span>


<label>
    Posición vertical:
</label>

<input
    type="range"
    id="posY"
    min="-100"
    max="100"
    value="0"
>

<span id="posYValue">0</span>


<button id="autoVertical">
    Girar automáticamente a vertical
</button>

<button id="reset">
    Restablecer
</button>
</div>
<div class="foto">
<h2>3. Vista previa</h2>

<p>
    Resolución final:
    <strong>128 × 160 píxeles</strong>
</p>

<canvas
    id="canvas"
    width="128"
    height="160"
    style="image-rendering: pixelated; border: 1px solid black;"
></canvas>


<button id="actualizar">
    Actualizar vista previa
</button>


<h2>4. Información</h2>

    Todavía no se ha procesado ninguna imagen.


    Tamaño RGB565:
    <strong id="tamano">0 bytes</strong>
</div>


<div class="descargar">
<h2>5. Descargar</h2>

<button id="descargar">
    Descargar imagen_lvgl.c
</button>


<button id="descargarBinario">
    Descargar datos RGB565 (.bin)
</button>

<button id="enviarESP32">
    Mostrar en ESP32
</button>

<p id="estadoESP32"></p>
</div>


</body>
</html>
