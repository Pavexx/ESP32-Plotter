<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotter</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="Header">
        <div class="imagen">
            
        </div>

        <div class="texto">
            <h1>Plotter</h1>

        </div>
    </div>

    <div class="contenido">

        <div class="ajustes">

            <div class="textoos">
                <h2>Cargar Archivo</h2>
            </div>

            <div class="contenido-interno">

<canvas
    id="canvas"
    width="128"
    height="160"
    style="image-rendering: pixelated; border: 1px solid black;"
></canvas>



                <input  type="file" id="fileInput" accept="image/*">

                <h2>Opciones</h2>

                <label for="modo">Modo de ajuste:</label>
                <select id="modo">
                    <option value="crop">Recortar para llenar</option>
                    <option value="stretch">Estirar a 128x160</option>
                </select>

                <button id="rotacion">
                    Rotar
                </button>

                <label for="posX">Posición horizontal:</label>
                <input type="range" id="posX" min="-100" max="100" value="0">

                <label for="posY">Posición vertical:</label>
                <input type="range" id="posY" min="-100" max="100" value="0">


                <button id="reset">
                    Restablecer
                </button>



                <button id="autoVertical">
                    Imprimir
                </button>

                

            </div>
            <p></p>

        </div>


</div>
<script src="script.js"></script>
</body>
</html>
