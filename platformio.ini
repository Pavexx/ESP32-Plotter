; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.6
	madhephaestus/ESP32Servo@^3.2.1
	esphome/ESPAsyncWebServer-esphome@^3.4.0
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	esphome/AsyncTCP-esphome@^2.1.4
	gin66/FastAccelStepper@^2.0.1
	# Core FluidNC libraries (grab from GitHub)
    https://github.com/fluidnc/fluidnc-core.git#v3.0
    # SD library for ESP32
    sd-fat-esp32
    # FastAccelStepper for high‑speed step generation
    https://github.com/waspinator/AccelStepper.git
    # Optional: ArduinoJson (for config files)
    ArduinoJson
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600